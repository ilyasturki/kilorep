name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    web:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
            - run: bun install --frozen-lockfile

            - name: Unit tests
              run: bun run test:unit

            - name: Domain tests (server persistence on in-memory sqlite)
              run: bun run test:domain

            - name: Contract test (responses validated against openapi/kilorep.json)
              run: bun run test:contract

            - name: Isolation suite (sealed-cookie + bearer paths)
              run: |
                  NUXT_OAUTH_GOOGLE_CLIENT_ID=x \
                  NUXT_OAUTH_GOOGLE_CLIENT_SECRET=y \
                  NUXT_SESSION_PASSWORD=test-password-at-least-32-characters-long \
                  DB_FILE_NAME=.data/test-auth.db \
                  NUXT_GOOGLE_JWKS_URL=http://localhost:4098/jwks \
                  NUXT_IGNORE_LOCK=1 \
                  bunx nuxt dev --port 4099 &
                  bun run test:isolation

    android:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: android
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '17'
            - uses: gradle/actions/setup-gradle@v4

            # The Kotlin client is generated from openapi/kilorep.json at build
            # time, so an API change that breaks the app breaks this job — the
            # contract has nowhere to drift.
            - name: Generate + compile API client
              run: ./gradlew :api:compileKotlin

            - name: JVM unit tests (sync engine, drafts, ViewModels)
              run: ./gradlew :app:testDebugUnitTest

            - name: Assemble debug APK
              run: ./gradlew :app:assembleDebug

    nix:
        runs-on: ubuntu-latest
        # A stale nix/bun.nix makes the sandboxed `bun install` hang on doomed
        # network retries instead of failing; the timeout turns that (or any
        # other build stall) into a red check rather than a stuck job.
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4
            - uses: cachix/install-nix-action@v31
              with:
                  extra_nix_config: |
                      experimental-features = nix-command flakes
                      extra-substituters = https://nix-community.cachix.org
                      extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

            # bun.lock can change without nix/bun.nix being regenerated; in the
            # sandboxed build that drift hangs on the missing packages. Regenerate
            # and diff so the drift is caught here with a clear fix, not at deploy.
            - name: nix/bun.nix is in sync with bun.lock
              run: |
                  nix run github:nix-community/bun2nix/2.1.0 -- -o nix/bun.nix
                  git diff --exit-code nix/bun.nix \
                    || { echo "::error::nix/bun.nix is stale — run 'nix run github:nix-community/bun2nix/2.1.0 -- -o nix/bun.nix' and commit the result"; exit 1; }

            - name: Build the server package
              run: nix build .#kilorep -L
