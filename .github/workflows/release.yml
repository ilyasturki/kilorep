name: release

# Secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
# The keystore is the app's identity to Android — an APK signed by another key cannot update an installed one.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  apk:
    needs: checks
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      # Android refuses an update whose versionCode is not strictly greater than the
      # installed one, and a shipped code can never be taken back down.
      - name: Resolve version from the tag
        id: version
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"

          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag '$tag' is not vMAJOR.MINOR.PATCH — refusing to derive an Android version from it."
            exit 1
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"

          if (( minor > 99 || patch > 99 )); then
            echo "::error::Tag '$tag' overflows the versionCode encoding (minor and patch must each stay under 100). Bump the component to its left instead."
            exit 1
          fi

          echo "name=${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
          echo "code=$(( major * 10000 + minor * 100 + patch ))" >> "$GITHUB_OUTPUT"

      # Android Gradle Plugin 8.13 (android/build.gradle) needs 17 at minimum, targets 21.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Tracks android/variables.gradle — `compileSdkVersion = 36`.
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v6

      - uses: oven-sh/setup-bun@v2

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - run: bun run app:sync

      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. See the header of this workflow for the four secrets a release needs."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kilorep.jks"

      - name: Assemble the release APK
        working-directory: android
        env:
          KILOREP_KEYSTORE: ${{ runner.temp }}/kilorep.jks
          KILOREP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KILOREP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KILOREP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PkilorepVersionName='${{ steps.version.outputs.name }}' \
            -PkilorepVersionCode='${{ steps.version.outputs.code }}'

      - name: Verify the APK is signed
        id: apk
        run: |
          set -euo pipefail
          out=android/app/build/outputs/apk/release
          if [[ ! -f "$out/app-release.apk" ]]; then
            echo "::error::No signed APK at $out/app-release.apk. Gradle produced $(ls "$out" 2>/dev/null | tr '\n' ' ' || echo 'nothing'), which means the signing config was skipped — check the four ANDROID_* secrets."
            exit 1
          fi
          apk="$RUNNER_TEMP/kilorep-${{ steps.version.outputs.name }}.apk"
          mv "$out/app-release.apk" "$apk"
          echo "path=$apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: kilorep-${{ steps.version.outputs.name }}-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" '${{ steps.apk.outputs.path }}' --clobber
