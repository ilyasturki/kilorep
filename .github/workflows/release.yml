name: release

# A `vMAJOR.MINOR.PATCH` tag becomes a GitHub release with a signed APK attached.
#
# The tag is the only input. Both Android version fields are derived from it
# (see the resolve step) rather than committed, so a release cannot ship a
# version string that disagrees with the tag it was cut from — which is what
# android/app/build.gradle's hardcoded `versionCode 1` guaranteed before this.
#
# Four secrets are required, and the build fails loudly rather than shipping an
# unsigned artifact if they are missing — see the verify step:
#
#   ANDROID_KEYSTORE_BASE64     the keystore itself, base64 of the .jks
#   ANDROID_KEYSTORE_PASSWORD   its store password
#   ANDROID_KEY_ALIAS           the key inside it
#   ANDROID_KEY_PASSWORD        that key's password
#
# The keystore is the app's identity to Android: an APK signed by a different
# key is a different app, and no device will install it over the old one. It is
# not regenerable and not recoverable. Back up the .jks and its passwords
# somewhere that is not this repository and not this runner.

on:
  push:
    tags: ['v*']

# Read-only by default, and widened on the one job that has to write. Declaring
# `contents: write` at the top would hand it to the checks job as well, which
# runs the repository's own lint and test tooling and has no business being able
# to publish anything.
permissions:
  contents: read

jobs:
  # A tag is not exempt from the gate. If the tagged commit does not pass what a
  # pull request has to pass, no APK is built and no release is cut.
  checks:
    uses: ./.github/workflows/checks.yml

  apk:
    needs: checks
    runs-on: ubuntu-latest

    # Cutting the release and uploading the asset both write to the repository.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      # Android wants two version fields and they answer different questions.
      # `versionName` is the string a human reads; `versionCode` is the integer
      # the system compares, and an update whose code is not strictly greater
      # than the installed one is refused outright.
      #
      # Packing the semver into that integer — 10000·major + 100·minor + patch —
      # keeps it monotonic in the tag and reproducible from the tag alone, which
      # a run number or a timestamp is not. The cost is a hard ceiling of 99 on
      # both minor and patch, checked here: rolling over would produce a *lower*
      # code than the release before it, and users would silently stop being
      # offered updates. A caught tag is a five-second fix; a shipped one is
      # permanent, because the code can never go back down.
      - name: Resolve version from the tag
        id: version
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"

          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag '$tag' is not vMAJOR.MINOR.PATCH — refusing to derive an Android version from it."
            exit 1
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"

          if (( minor > 99 || patch > 99 )); then
            echo "::error::Tag '$tag' overflows the versionCode encoding (minor and patch must each stay under 100). Bump the component to its left instead."
            exit 1
          fi

          echo "name=${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
          echo "code=$(( major * 10000 + minor * 100 + patch ))" >> "$GITHUB_OUTPUT"

      # 21 rather than the runner default: Android Gradle Plugin 8.13 (see
      # android/build.gradle) needs 17 at minimum and targets 21.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Named explicitly rather than left to the plugin's auto-download, so the
      # build fails at setup with a clear message if a component is unavailable
      # instead of midway through a Gradle task. Both versions track
      # android/variables.gradle — `compileSdkVersion = 36`.
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v6

      - uses: oven-sh/setup-bun@v2

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      # The project's own script, not its two halves spelled out again: it is
      # `build:app` followed by `cap sync android`, and it is what gets run
      # locally. A release built by a different recipe than the one a developer
      # exercises daily is a release nobody has actually tested.
      - run: bun run app:sync

      # Written under RUNNER_TEMP rather than into the checkout: the workspace is
      # what later steps glob over and what an artifact upload would sweep up,
      # and a keystore has no business being anywhere near either.
      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. See the header of this workflow for the four secrets a release needs."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kilorep.jks"

      # The environment variables are read by android/app/build.gradle, which
      # only declares a signing config when KILOREP_KEYSTORE is present — that is
      # what keeps a plain `./gradlew assembleDebug` working on a laptop with no
      # keystore at all.
      - name: Assemble the release APK
        working-directory: android
        env:
          KILOREP_KEYSTORE: ${{ runner.temp }}/kilorep.jks
          KILOREP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KILOREP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KILOREP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PkilorepVersionName='${{ steps.version.outputs.name }}' \
            -PkilorepVersionCode='${{ steps.version.outputs.code }}'

      # The signing config in build.gradle is conditional, so a missing or
      # misspelled secret does not fail the build — it produces
      # `app-release-unsigned.apk`, an artifact no device will install, under a
      # green check. Asserting on the filename catches that: the plugin only
      # drops the `-unsigned` suffix once the APK is actually signed.
      #
      # The rename is for the person downloading it. `app-release.apk` says
      # nothing about which app or which version it is.
      - name: Verify the APK is signed
        id: apk
        run: |
          set -euo pipefail
          out=android/app/build/outputs/apk/release
          if [[ ! -f "$out/app-release.apk" ]]; then
            echo "::error::No signed APK at $out/app-release.apk. Gradle produced $(ls "$out" 2>/dev/null | tr '\n' ' ' || echo 'nothing'), which means the signing config was skipped — check the four ANDROID_* secrets."
            exit 1
          fi
          apk="$RUNNER_TEMP/kilorep-${{ steps.version.outputs.name }}.apk"
          mv "$out/app-release.apk" "$apk"
          echo "path=$apk" >> "$GITHUB_OUTPUT"

      # Kept regardless of what happens below, so a failure to publish does not
      # also mean a rebuild.
      - uses: actions/upload-artifact@v7
        with:
          name: kilorep-${{ steps.version.outputs.name }}-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      # `gh` rather than a third-party action: it ships on the runner and the
      # token is the one this workflow was already granted.
      #
      # Create-if-absent rather than create outright, because a release may
      # already exist — a tag pushed from a draft release, or a re-run of this
      # job. `--clobber` makes the upload idempotent for the same reason.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" '${{ steps.apk.outputs.path }}' --clobber
