name: checks

on: workflow_call

# Declared here because a called workflow otherwise inherits the caller's permissions.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Nothing else reads these: prettier ignores /android/ (.prettierignore)
      # and the first parser to see them is aapt2, minutes into the release
      # build — where a stray `--` inside a comment once failed the APK with
      # every other check already green. Expat holds the same line for free,
      # so it runs before the install and the build rather than after them.
      - name: Parse the Android resource XML
        run: |
          python3 - <<'PY'
          import pathlib, sys, xml.dom.minidom

          broken = []
          for path in sorted(pathlib.Path('android/app/src').rglob('*.xml')):
              try:
                  xml.dom.minidom.parse(str(path))
              except Exception as error:
                  broken.append(f'::error file={path}::{error}')

          print('\n'.join(broken))
          sys.exit(1 if broken else 0)
          PY

      - uses: oven-sh/setup-bun@v2

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - run: bun run format
      - run: bun run lint
      - run: bun run check
      - run: bun run test

      - run: bun run build:app

      # A machine that brings its own browser names it in PLAYWRIGHT_CHROMIUM and skips
      # this: on NixOS a downloaded chromium does not run, and there is no apt to give it
      # its libraries.
      - name: Install chromium for the end-to-end suite
        run: |
          if [ -z "${PLAYWRIGHT_CHROMIUM:-}" ]; then
            bunx playwright install --with-deps chromium
          fi

      # Builds the server and the app bundle it serves, so it runs from a fresh checkout.
      - name: End-to-end suite
        run: bun run test:e2e

      - name: Keep the end-to-end report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
